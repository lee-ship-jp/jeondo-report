<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evangelism Report</title>
  <style>
    :root {
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --green: #16a34a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Noto Sans KR", "Noto Sans JP", "Noto Sans Myanmar", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-text-size-adjust: 100%;
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 18px;
    }
    .brand { font-size: 15px; font-weight: 700; color: var(--blue); white-space: nowrap; flex-shrink: 0; }
    .lang-select {
      font-size: 14px; padding: 7px 10px; border-radius: 10px;
      border: 1px solid var(--border); background: #fff; color: var(--text);
    }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 18px; padding: 22px; box-shadow: 0 1px 3px rgba(0,0,0,.04);
    }
    h1 { font-size: 22px; margin: 0 0 6px; }
    .subtitle { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
    label { display: block; font-size: 14px; font-weight: 600; margin: 18px 0 7px; }
    select, input[type="date"], input[type="text"], textarea {
      width: 100%; font-size: 16px; padding: 13px 14px;
      border: 1px solid var(--border); border-radius: 12px;
      background: #fff; color: var(--text); font-family: inherit;
    }
    /* iOS Safari에서 날짜 값이 가운데로 쏠리는 현상 방지 → 다른 칸처럼 왼쪽 정렬 */
    input[type="date"] { text-align: left; -webkit-appearance: none; appearance: none; min-height: 50px; }
    input[type="date"]::-webkit-date-and-time-value { text-align: left; margin: 0; }
    input[type="date"]::-webkit-calendar-picker-indicator { margin-left: auto; }
    textarea { min-height: 170px; resize: vertical; line-height: 1.55; }
    select:focus, input:focus, textarea:focus {
      outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }
    .btn {
      width: 100%; margin-top: 24px; padding: 15px; font-size: 17px; font-weight: 700;
      color: #fff; background: var(--blue); border: none; border-radius: 14px;
      cursor: pointer; transition: background .15s;
    }
    .btn:active { background: var(--blue-dark); }
    .btn:disabled { opacity: .55; cursor: default; }
    .toast {
      margin-top: 16px; padding: 13px 14px; border-radius: 12px;
      font-size: 15px; font-weight: 600; text-align: center; display: none;
    }
    .toast.ok { display: block; background: #dcfce7; color: #166534; }
    .toast.err { display: block; background: #fee2e2; color: #b91c1c; }
    .adminlink, .backlink {
      display: inline-block; margin-top: 22px; font-size: 13px;
      color: var(--muted); text-decoration: none; cursor: pointer;
    }
    .adminlink:hover, .backlink:hover { color: var(--blue); text-decoration: underline; }
    .center { text-align: center; }
    .hidden { display: none; }
    .summary-box {
      margin-top: 18px; background: #f8fafc; border: 1px solid var(--border);
      border-radius: 12px; padding: 16px; white-space: pre-wrap;
      font-size: 14.5px; line-height: 1.6; min-height: 60px; word-break: break-word;
    }
    .muted-note { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
    .row { display: flex; gap: 10px; align-items: flex-end; }
    .row > div { flex: 1; }
    .daterow { display: flex; gap: 8px; align-items: center; }
    .daterow input[type="date"] { flex: 1; }
    .navbtn {
      flex: 0 0 auto; padding: 12px 13px; font-size: 16px; font-weight: 700;
      background: #fff; color: var(--blue); border: 1px solid var(--border);
      border-radius: 12px; cursor: pointer; line-height: 1;
    }
    .navbtn:active { background: #eff6ff; }
    .spinner { color: var(--muted); font-size: 14px; padding: 12px 0; }
  </style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <span class="brand">⛪ <span id="brandText">Evangelism Report</span></span>
    <select id="uiLang" class="lang-select" onchange="changeLang(this.value)">
      <option value="en">English</option>
      <option value="ko">한국어</option>
      <option value="ja">日本語</option>
      <option value="fr">Français</option>
      <option value="es">Español</option>
      <option value="tl">Tagalog</option>
      <option value="my">မြန်မာ</option>
    </select>
  </div>

  <!-- 제출 화면 -->
  <div id="formView" class="card">
    <h1 data-i18n="title">Evangelism Report</h1>
    <p class="subtitle" data-i18n="subtitle"></p>

    <!-- 작성 단계: 이름·날짜·내용 입력 + 검토 화면으로 넘어가는 버튼 -->
    <div id="editStep">
      <label data-i18n="nameLabel">Your name</label>
      <select id="name" onchange="onNameChange()">
        <option value="" data-i18n="selectName"></option>
      </select>
      <input type="text" id="nameOther" class="hidden" data-i18n-ph="otherPlaceholder" style="margin-top:8px;" onchange="checkExisting()">

      <label data-i18n="dateLabel">Date</label>
      <input type="date" id="date" onchange="checkExisting()">

      <label data-i18n="contentLabel">Today's evangelism</label>
      <textarea id="content" data-i18n-ph="contentPlaceholder"></textarea>

      <div class="muted-note hidden" id="alreadyNote" style="color:#b45309;"></div>

      <button class="btn" id="submitBtn" onclick="reviewReport()" data-i18n="submitBtn">Submit</button>
    </div>

    <!-- 검토 단계: 제출 전 본인이 내용을 확인하고 수정할 수 있는 화면 -->
    <div id="reviewStep" class="hidden">
      <div class="summary-box" id="reviewContent"></div>
      <div class="muted-note" data-i18n="reviewNote"></div>
      <button class="btn" id="confirmBtn" onclick="doSubmit()" data-i18n="confirmBtn">Submit this</button>
      <button class="navbtn" style="width:100%; margin-top:10px;" id="editBackBtn"
              onclick="backToEdit()" data-i18n="editBtn">Edit</button>
    </div>

    <!-- 제출완료 단계: 이미 제출한 보고를 읽기 전용으로 보여주고, '수정하기'로 다시 고칠 수 있다 -->
    <div id="submittedStep" class="hidden">
      <div class="summary-box" id="submittedContent"></div>
      <div class="muted-note" data-i18n="submittedNote"></div>
      <button class="btn" id="editMineBtn" onclick="editMine()" data-i18n="editBtn">Edit</button>
      <button class="navbtn" style="width:100%; margin-top:10px;" id="newReportBtn"
              onclick="newReport()" data-i18n="newReportBtn">✚ New report</button>
    </div>

    <div class="toast" id="toast"></div>

    <div class="center">
      <span class="adminlink" onclick="showAdmin()" data-i18n="adminLink">📋 View summary (admin)</span>
    </div>
  </div>

  <!-- 관리자 종합 화면 -->
  <div id="adminView" class="card hidden">
    <h1 data-i18n="adminTitle">Summary for Pastor</h1>

    <label data-i18n="adminDatesLabel">Days with reports</label>
    <select id="adminDates" onchange="pickDate(this.value)">
      <option value="" data-i18n="adminDatesEmpty"></option>
    </select>

    <label data-i18n="adminDateLabel">Date</label>
    <div class="daterow">
      <button class="navbtn" onclick="stepDate(-1)" title="이전 날">◀</button>
      <input type="date" id="adminDate" onchange="loadSummary()">
      <button class="navbtn" onclick="stepDate(1)" title="다음 날">▶</button>
      <button class="navbtn" onclick="loadSummary()" title="새로고침">🔄</button>
    </div>

    <div id="summaryWrap" class="hidden">
      <div class="summary-box" id="summaryBox"></div>
      <button class="btn" onclick="copySummary()" data-i18n="copyBtn">Copy</button>
      <div class="muted-note" data-i18n="copyNote"></div>
    </div>
    <div id="summarySpinner" class="spinner hidden" data-i18n="loadingMsg"></div>

    <div class="center">
      <span class="backlink" onclick="showForm()" data-i18n="backLink">← Back to report form</span>
    </div>
  </div>

</div>

    copyBtn:"ကူးယူရန်", copiedMsg:"ကူးယူပြီးပါပြီ!", copyNote:"အပေါ်ကစာသားကို ကူးယူပါမည်။",
    noReportsMsg:"ဤရက်စွဲအတွက် အစီရင်ခံစာမရှိပါ။", loadingMsg:"ဖွင့်နေသည်...",
    reviewNote:"သင့်အစီရင်ခံစာကို စစ်ဆေးပါ။ ပြင်ရန် 'ပြင်ဆင်ရန်' ကိုနှိပ်ပါ။",
    editBtn:"✏️ ပြင်ဆင်ရန်", confirmBtn:"✅ ဤအတိုင်းတင်ရန်",
    alreadyNote:"ဒီနေ့ သင်တင်သွင်းပြီးသား အစီရင်ခံစာ ရှိပါသည်။ ပြင်ဆင်၍ ပြန်တင်လျှင် ယခင်အစီရင်ခံစာကို ပြင်ဆင်မည်ဖြစ်သည်။",
    updateBtn:"ကျွန်ုပ်၏အစီရင်ခံစာ ပြင်ဆင်ရန်", updatedMsg:"သင့်အစီရင်ခံစာ ပြင်ဆင်ပြီးပါပြီ! 🙏", checkingMsg:"စစ်ဆေးနေသည်...",
    submittedNote:"ဤအစီရင်ခံစာကို တင်သွင်းပြီးဖြစ်သည်။ ပြင်ရန် 'ပြင်ဆင်ရန်' ကိုနှိပ်ပါ။", newReportBtn:"✚ အသစ်ရေးရန်"
  }
};

var LANG = 'en';
var lastSummaryText = '';
var editingExisting = false;  // 오늘 이미 제출한 보고를 수정 중인지 여부

window.onload = function () {
  var saved = null;
  try { saved = localStorage.getItem('uiLang'); } catch (e) {}
  if (saved && I18N[saved]) LANG = saved;
  document.getElementById('uiLang').value = LANG;

  var today = todayStr();
  document.getElementById('date').value = today;
  document.getElementById('adminDate').value = today;

  applyLang();
  loadNames();
};

function todayStr() {
  var d = new Date();
  var m = ('0' + (d.getMonth() + 1)).slice(-2);
  var day = ('0' + d.getDate()).slice(-2);
  return d.getFullYear() + '-' + m + '-' + day;
}

function changeLang(v) {
  LANG = v;
  try { localStorage.setItem('uiLang', v); } catch (e) {}
  applyLang();
}

function applyLang() {
  var t = I18N[LANG] || I18N.en;
  document.documentElement.lang = LANG;
  document.getElementById('brandText').textContent = t.title;
  var els = document.querySelectorAll('[data-i18n]');
  for (var i = 0; i < els.length; i++) {
    var key = els[i].getAttribute('data-i18n');
    if (t[key] != null) els[i].textContent = t[key];
  }
  var phs = document.querySelectorAll('[data-i18n-ph]');
  for (var j = 0; j < phs.length; j++) {
    var k = phs[j].getAttribute('data-i18n-ph');
    if (t[k] != null) phs[j].setAttribute('placeholder', t[k]);
  }
  var otherOpt = document.getElementById('otherOpt');
  if (otherOpt) otherOpt.textContent = t.otherOption;
  refreshSubmitLabel();
}

/* 제출 버튼 글자 — 수정 모드면 '수정해서 다시 제출', 아니면 '제출하기' */
function refreshSubmitLabel() {
  var btn = document.getElementById('submitBtn');
  if (btn) btn.textContent = tr(editingExisting ? 'updateBtn' : 'submitBtn');
}

function tr(key) { return (I18N[LANG] || I18N.en)[key]; }

/* 현재 화면에 입력된 이름(기타면 직접입력 값) 반환 */
function currentName() {
  var v = document.getElementById('name').value;
  if (v === '__other__') v = document.getElementById('nameOther').value.trim();
  return v;
}

/* ---------- 명단 로드 (Apps Script API) ---------- */
function loadNames() {
  fetch(API + '?action=getNames')
    .then(function (r) { return r.json(); })
    .then(function (res) { populateNames((res && res.names) || []); })
    .catch(function () { populateNames([]); });
}

function populateNames(names) {
  var sel = document.getElementById('name');
  for (var i = 0; i < names.length; i++) {
    var o = document.createElement('option');
    o.value = names[i];
    o.textContent = names[i];
    sel.appendChild(o);
  }
  // "기타 (직접 입력)" 옵션
  var other = document.createElement('option');
  other.value = '__other__';
  other.id = 'otherOpt';
  other.textContent = tr('otherOption');
  sel.appendChild(other);
}

function onNameChange() {
  var sel = document.getElementById('name');
  var other = document.getElementById('nameOther');
  if (sel.value === '__other__') {
    other.classList.remove('hidden');
    other.focus();
  } else {
    other.classList.add('hidden');
  }
  checkExisting();
}

/* 작성/검토/제출완료 세 단계 중 하나만 보이게 전환 */
function showStep(step) {
  ['editStep', 'reviewStep', 'submittedStep'].forEach(function (id) {
    document.getElementById(id).classList.toggle('hidden', id !== step);
  });
}

/* ---------- 이름·날짜 선택 시: 그날 본인 보고가 있으면 '제출완료' 화면을 보여준다 ---------- */
function checkExisting() {
  var name = currentName();
  var date = document.getElementById('date').value || todayStr();

  // 이름이 아직 없으면(미선택/기타 미입력) 그대로 작성 화면 유지
  if (!name) { setEditingMode(false); showStep('editStep'); return; }

  fetch(API + '?action=getMyReport&name=' + encodeURIComponent(name) + '&date=' + encodeURIComponent(date))
    .then(function (r) { return r.json(); })
    .then(function (res) {
      var rep = res && res.report;
      if (rep && rep.exists) {
        // 이미 제출한 보고가 있으면 원문을 채워두고, 읽기 전용 '제출완료' 화면을 보여준다
        document.getElementById('content').value = rep.content || '';
        showSubmitted(rep.content || '');
      } else {
        setEditingMode(false);
        showStep('editStep');
      }
    })
    .catch(function () { setEditingMode(false); showStep('editStep'); });
}

function setEditingMode(on) {
  editingExisting = on;
  var note = document.getElementById('alreadyNote');
  if (on) { note.textContent = tr('alreadyNote'); note.classList.remove('hidden'); }
  else { note.classList.add('hidden'); }
  refreshSubmitLabel();
}

/* ---------- 제출완료 화면: 이미 낸 보고를 읽기 전용으로 보여줌 ---------- */
function showSubmitted(content) {
  document.getElementById('submittedContent').textContent = content;
  editingExisting = true;          // 이 보고를 고치면 기존 건이 갱신(업서트)된다
  showStep('submittedStep');
}

/* '수정하기' → 입력 화면으로 (내용은 이미 채워져 있음) */
function editMine() {
  setEditingMode(true);
  showStep('editStep');
  document.getElementById('content').focus();
}

/* '새 보고 작성' → 폼을 비우고 작성 화면으로 (공용 기기에서 다음 사람용) */
function newReport() {
  document.getElementById('content').value = '';
  document.getElementById('name').value = '';
  document.getElementById('nameOther').value = '';
  document.getElementById('nameOther').classList.add('hidden');
  setEditingMode(false);
  showStep('editStep');
}

/* ---------- 1단계: 제출 전 검토 화면으로 ---------- */
function reviewReport() {
  var name = currentName();
  var content = document.getElementById('content').value.trim();

  if (!name) { showToast('err', tr('nameRequired')); return; }
  if (!content) { showToast('err', tr('contentRequired')); return; }

  document.getElementById('reviewContent').textContent = content;
  document.getElementById('confirmBtn').textContent = tr(editingExisting ? 'updateBtn' : 'confirmBtn');
  document.getElementById('toast').className = 'toast';
  showStep('reviewStep');
}

/* 검토 화면 → 다시 작성으로 */
function backToEdit() {
  showStep('editStep');
}

/* ---------- 2단계: 실제 제출/수정 (Apps Script API · POST) ---------- */
function doSubmit() {
  var name = currentName();
  var date = document.getElementById('date').value || todayStr();
  var content = document.getElementById('content').value.trim();
  var btn = document.getElementById('confirmBtn');
  var wasEditing = editingExisting;

  if (!name) { showToast('err', tr('nameRequired')); return; }
  if (!content) { showToast('err', tr('contentRequired')); return; }

  btn.disabled = true;
  btn.textContent = tr('submittingMsg');
  document.getElementById('toast').className = 'toast';

  fetch(API, {
    method: 'POST',
    body: JSON.stringify({ name: name, date: date, lang: LANG, content: content })
  })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      btn.disabled = false;
      btn.textContent = tr(wasEditing ? 'updateBtn' : 'confirmBtn');
      if (res && res.ok) {
        // 백엔드가 갱신했는지(updated) 또는 화면이 수정 모드였는지로 메시지 결정
        showToast('ok', tr((res.updated || wasEditing) ? 'updatedMsg' : 'successMsg'));
        // 제출 후엔 '제출완료' 화면을 보여줘서, 나중에 '수정하기'로 다시 고칠 수 있게 한다
        showSubmitted(content);
      } else {
        showToast('err', tr('errorMsg'));
      }
    })
    .catch(function () {
      btn.disabled = false;
      btn.textContent = tr(wasEditing ? 'updateBtn' : 'confirmBtn');
      showToast('err', tr('errorMsg'));
    });
}

function showToast(type, msg) {
  var toast = document.getElementById('toast');
  toast.className = 'toast ' + type;
  toast.textContent = msg;
  if (type === 'ok') {
    setTimeout(function () { toast.className = 'toast'; }, 4000);
  }
}

function showAdmin() {
  document.getElementById('formView').classList.add('hidden');
  document.getElementById('adminView').classList.remove('hidden');
  loadAdminDates();   // 보고가 있는 날짜 목록을 받아 드롭다운 채우고 최신 날짜 자동 표시
}
function showForm() {
  document.getElementById('adminView').classList.add('hidden');
  document.getElementById('formView').classList.remove('hidden');
}

/* 보고가 있는 날짜 목록 로드 → 드롭다운 채우고 가장 최근 날짜 자동 표시 */
function loadAdminDates() {
  fetch(API + '?action=getReportDates')
    .then(function (r) { return r.json(); })
    .then(function (res) {
      var dates = (res && res.dates) || [];
      var sel = document.getElementById('adminDates');
      sel.length = 1; // 안내 옵션만 남기고 비움
      for (var i = 0; i < dates.length; i++) {
        var o = document.createElement('option');
        o.value = dates[i];
        o.textContent = formatKoreanDate(dates[i]);
        sel.appendChild(o);
      }
      // 가장 최근 보고 날짜를 자동 선택·표시 (없으면 오늘)
      var target = dates.length ? dates[0] : document.getElementById('adminDate').value;
      document.getElementById('adminDate').value = target;
      sel.value = (dates.indexOf(target) >= 0) ? target : '';
      loadSummary();
    })
    .catch(function () { loadSummary(); });
}

/* 드롭다운에서 날짜 선택 → 바로 표시 */
function pickDate(d) {
  if (!d) return;
  document.getElementById('adminDate').value = d;
  loadSummary();
}

/* 이전/다음 날로 이동 → 바로 표시 */
function stepDate(delta) {
  var inp = document.getElementById('adminDate');
  var base = inp.value ? new Date(inp.value + 'T00:00:00') : new Date();
  base.setDate(base.getDate() + delta);
  var m = ('0' + (base.getMonth() + 1)).slice(-2);
  var day = ('0' + base.getDate()).slice(-2);
  inp.value = base.getFullYear() + '-' + m + '-' + day;
  document.getElementById('adminDates').value = inp.value; // 목록에 있으면 동기화, 없으면 빈값
  loadSummary();
}

/* ---------- 관리자 종합 (Apps Script API) ---------- */
function loadSummary() {
  var date = document.getElementById('adminDate').value;
  if (!date) return;
  document.getElementById('summaryWrap').classList.add('hidden');
  document.getElementById('summarySpinner').classList.remove('hidden');

  fetch(API + '?action=getReports&date=' + encodeURIComponent(date))
    .then(function (r) { return r.json(); })
    .then(function (res) {
      document.getElementById('summarySpinner').classList.add('hidden');
      renderSummary(date, (res && res.reports) || []);
    })
    .catch(function () {
      document.getElementById('summarySpinner').classList.add('hidden');
      renderSummary(date, []);
    });
}

function renderSummary(date, rows) {
  var box = document.getElementById('summaryBox');
  document.getElementById('summaryWrap').classList.remove('hidden');
  if (!rows || rows.length === 0) {
    box.textContent = tr('noReportsMsg');
    lastSummaryText = '';
    return;
  }
  var text = '📋 ' + formatKoreanDate(date) + ' 전도 보고\n';
  text += '━━━━━━━━━━━━━━━━\n\n';
  for (var i = 0; i < rows.length; i++) {
    text += '🙋 ' + (rows[i].nameKo || rows[i].name) + '\n';  // 한글 이름 우선
    text += rows[i].ko + '\n';
    if (i < rows.length - 1) text += '\n';
  }
  lastSummaryText = text;
  box.textContent = text;
}

function formatKoreanDate(d) {
  var p = d.split('-');
  if (p.length === 3) return p[0] + '년 ' + parseInt(p[1], 10) + '월 ' + parseInt(p[2], 10) + '일';
  return d;
}

function copySummary() {
  if (!lastSummaryText) return;
  var done = function () { showToast('ok', tr('copiedMsg')); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(lastSummaryText).then(done, fallbackCopy);
  } else {
    fallbackCopy();
  }
  function fallbackCopy() {
    var ta = document.createElement('textarea');
    ta.value = lastSummaryText;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
  }
}
</script>
